name: Feature request
description: Suggest an improvement to the agent.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Many features need a matching change in the Arkame panel, which is not in this repository. Describing the problem well matters more than the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it could work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried or considered.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, install method (Docker or native), bucket provider
