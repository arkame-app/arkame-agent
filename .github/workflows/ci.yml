name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Formatação
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do gofmt:"; echo "$unformatted"; exit 1
          fi

      # MinIO para os testes que tocam bucket de verdade (a purga, que apaga
      # dados do cliente). O `services:` do Actions não aceita o comando que a
      # imagem precisa, então sobe num passo.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=arkametest -e MINIO_ROOT_PASSWORD=arkametest123 \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO não subiu"; docker logs minio; exit 1

      - name: Testes
        env:
          ARKAME_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: go test -race ./...

      # O agent roda em três sistemas e o código de serviço é específico de
      # cada um — compilar só no Linux esconderia justamente essa parte.
      - name: Cross-compile
        run: |
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64" "windows arm64"; do
            set -- $target
            echo "→ $1/$2"
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -o /dev/null ./...
          done

      - name: Verifica o install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh

  # O `main` vermelho vira issue — e o verde a fecha.
  #
  # A CI ficou vermelha de 08/09 a 22/09 sem ninguém ver, e escondia um defeito
  # real: o prazo dos comandos antes/depois do backup matava só o shell, e um
  # hook pendurado prendia o agendamento inteiro do servidor. A notificação
  # padrão do GitHub existia; ninguém a lia.
  #
  # Uma issue aberta é um sinal que fica: aparece no repositório, dispara aviso
  # para quem segue as issues, e continua lá até alguém resolver. Uma só por
  # vez — falhas seguidas viram comentários na mesma, para não soterrar a lista.
  # Quando o `main` volta ao verde, este mesmo workflow fecha a issue: o estado
  # dela é o estado do `main`, e não um alarme que alguém esqueceu de desligar.
  avisa-vermelho:
    name: Abre issue quando o main falha
    needs: build
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          AUTOR: ${{ github.event.head_commit.author.name }}
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          gh label create ci-vermelha --color B60205 --description "O main está vermelho" 2>/dev/null || true
          corpo=$(printf 'A CI falhou no `main`.\n\n- **Execução:** %s\n- **Commit:** `%s` — %s\n- **Mensagem:** %s\n\nEsta issue fecha sozinha quando o `main` voltar ao verde.' \
            "$EXECUCAO" "${COMMIT:0:7}" "$AUTOR" "$(printf '%s' "$MENSAGEM" | head -1)")
          aberta=$(gh issue list --label ci-vermelha --state open --json number --jq '.[0].number')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "$corpo"
          else
            gh issue create --label ci-vermelha --title "CI vermelha no main" --body "$corpo"
          fi

  fecha-quando-verde:
    name: Fecha a issue quando o main volta ao verde
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          for n in $(gh issue list --label ci-vermelha --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "O \`main\` voltou ao verde em \`${COMMIT:0:7}\`."
          done
