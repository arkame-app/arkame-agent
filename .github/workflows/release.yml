name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # criar o release e subir os artefatos
  packages: write   # publicar a imagem no ghcr
  id-token: write   # OIDC para a assinatura keyless do cosign

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o changelog precisa do histórico completo

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: sigstore/cosign-installer@v3

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
